<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DOER · flip glyph options</title>
<style>
*{box-sizing:border-box}
body{margin:0 auto;background:#111;color:#EDEAE2;font-family:Georgia,serif;max-width:430px;padding:40px 16px 60px;text-align:center}
h4{font-size:11px;letter-spacing:3px;color:#C2F03F;font-weight:normal;margin:0 0 26px}
.row{display:flex;justify-content:center;gap:26px;flex-wrap:wrap}
.opt{display:flex;flex-direction:column;align-items:center;gap:10px}
.vf{width:120px;height:120px;border-radius:16px;background:linear-gradient(135deg,#3E5A4A,#26382e);position:relative}
.btn{position:absolute;right:8px;bottom:8px;width:40px;height:40px;border-radius:50%;background:rgba(28,28,30,0.5);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center}
.lbl{font-size:12px;font-style:italic;color:#aaa}
</style>
</head>
<body>
<h4>THE FLIP GLYPH — FOUR WAYS</h4>
<div class="row">

<div class="opt"><div class="vf"><div class="btn">
<svg width="21" height="21" viewBox="0 0 20 20"><path d="M4 8 A6.5 6.5 0 0 1 14.6 4.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M15.6 1.5 L15.2 5.5 L11.6 4.1 Z" fill="#fff"/><path d="M16 12 A6.5 6.5 0 0 1 5.4 15.4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M4.4 18.5 L4.8 14.5 L8.4 15.9 Z" fill="#fff"/><rect x="6.6" y="7.9" width="6.8" height="4.8" rx="1.3" fill="#fff"/><circle cx="10" cy="10.3" r="1.25" fill="rgba(28,28,30,0.9)"/></svg>
</div></div><div class="lbl">A · current — arrows + camera<br/>(Apple's own symbol)</div></div>

<div class="opt"><div class="vf"><div class="btn">
<svg width="21" height="21" viewBox="0 0 20 20"><path d="M3.6 8.4 A7 7 0 0 1 15.6 5" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M16.6 1.7 L16.2 6 L12.3 4.6 Z" fill="#fff"/><path d="M16.4 11.6 A7 7 0 0 1 4.4 15" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M3.4 18.3 L3.8 14 L7.7 15.4 Z" fill="#fff"/></svg>
</div></div><div class="lbl">B · pure chasing arrows<br/>(cleanest at small size)</div></div>

<div class="opt"><div class="vf"><div class="btn">
<svg width="22" height="22" viewBox="0 0 20 20"><rect x="4" y="7.4" width="12" height="8.2" rx="2" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M7.4 7.4 L8.6 5.6 L11.4 5.6 L12.6 7.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="11.5" r="2.1" fill="none" stroke="#fff" stroke-width="1.3"/><path d="M13.2 3.2 A8.5 8.5 0 0 1 17.6 8.4" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/><path d="M18.6 5.4 L17.8 9.2 L14.6 7.4 Z" fill="#fff"/></svg>
</div></div><div class="lbl">C · camera + one loop arrow<br/>(more literal, busier)</div></div>

<div class="opt"><div class="vf"><div class="btn">
<svg width="21" height="21" viewBox="0 0 20 20"><path d="M4.5 12.8 A5.8 5.8 0 0 1 10 5.2 L12.5 5.2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M11.8 2.6 L15.2 5.2 L11.8 7.8 Z" fill="#fff"/><path d="M15.5 7.2 A5.8 5.8 0 0 1 10 14.8 L7.5 14.8" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><path d="M8.2 12.2 L4.8 14.8 L8.2 17.4 Z" fill="#fff"/></svg>
</div></div><div class="lbl">D · soft S-swap arrows<br/>(WhatsApp/Insta family)</div></div>

</div>
</body>
</html>
